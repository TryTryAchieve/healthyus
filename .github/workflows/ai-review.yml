name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: AI Code Review
        uses: TryTryAchieve/ai-code-reviewer@master
        with:
          llm_provider: "google"
          api_key: ${{ secrets.LLM_API_KEY }}
          custom_instructions: "This is a Next.js project using React and JavaScript."
